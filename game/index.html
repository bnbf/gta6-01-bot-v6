<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUMEN BAY: Neon Heat — open-world crime in a neon coastal city</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #11141b; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #test-results { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="LUMEN BAY: Neon Heat. Top-down open-world crime game: drive, steal cars, run from the police, finish 12 story missions in Solmar Bay."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="test-results"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
